<text x="1088" y="809" font-size="12" font-weight="600" fill="#8a5300" text-anchor="middle">filtered to &lt;100 real targets</text>
<text x="248" y="830" font-size="13.5" xml:space="preserve"><tspan font-weight="700" fill="#14325c">Stage 1 · DNS</tspan><tspan fill="#53617a">: a domain-generation algorithm encodes each victim in names under </tspan><tspan font-weight="700" fill="#14325c">avsvmcloud[.]com</tspan></text>
<text x="248" y="849" font-size="13.5" xml:space="preserve"><tspan fill="#53617a">the reply&#x27;s address range = passive / active / kill-switch; an alias record selects the victim</tspan></text>
<text x="248" y="868" font-size="13.5" xml:space="preserve"><tspan font-weight="700" fill="#14325c">Stage 2 · HTTPS</tspan><tspan fill="#53617a">: disguised as Orion telemetry; commands concealed in normal-looking data</tspan></text>
