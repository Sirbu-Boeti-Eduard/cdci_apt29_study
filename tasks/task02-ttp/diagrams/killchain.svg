<text x="248" y="1031" font-size="13.5" xml:space="preserve"><tspan fill="#53617a">Over the command-and-control channel, </tspan><tspan font-weight="700" fill="#14325c">TEARDROP / Raindrop</tspan><tspan fill="#53617a"> load </tspan><tspan font-weight="700" fill="#14325c">Cobalt Strike Beacon</tspan><tspan fill="#53617a"> for interactive control</tspan></text>
